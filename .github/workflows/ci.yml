name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Build for iOS Simulator
        run: xcodebuild build -scheme SwiftMusicService-Package -destination 'generic/platform=iOS Simulator'
      - name: Build for tvOS Simulator
        run: xcodebuild build -scheme SwiftMusicService-Package -destination 'generic/platform=tvOS Simulator'
